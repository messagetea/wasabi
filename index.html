<!DOCTYPE html>
  <html>
    <head>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    </head>
    <body>
  <style>
    model-viewer {
      width: 100%;
      height: 500px; /* 高さを指定しないと見えません */
     position: relative; /* ボタンの配置基準にするために追加 */
    }
 
   /* カスタムARボタンのデザイン */
   .custom-ar-button {
     background-color: #007bff; /* ボタンの色（青） */
     color: white;              /* 文字の色（白） */
     border-radius: 8px;        /* 角の丸み */
     border: none;
     position: absolute;        /* model-viewerを基準に配置 */
     bottom: 20px;              /* 下から20pxの位置 */
    left: 50%;                 /* 左右中央に配置 */
    transform: translateX(-50%); /* 中央揃えの微調整 */
     width: 80%;               /* ボタンの横幅を画面の80%に拡大 */
     max-width: 400px;         /* PCで見た時に大きくなりすぎないように制限 */
     padding: 20px 0;          /* 上下のタップ範囲をさらに大きく */
     font-size: 24px;          /* 文字を特大に */
     font-weight: bold;
     box-shadow: 0 4px 8px rgba(0,0,0,0.3); /* 少し影をつける */
     cursor: pointer;
   }
  </style>

  <model-viewer 
    src="wasabi8.glb" 
    ios-src="wasabi8.usdz" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    shadow-intensity="1">
 
   <!-- slot="ar-button" を指定することで、これがAR起動ボタンになります -->
   <button slot="ar-button" class="custom-ar-button">
     ARで表示する
   </button>
 
  </model-viewer>
    </body>
  </html>
